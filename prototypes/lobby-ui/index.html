<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="lobbies.css">
</head>
<body>
<header class="bar">
  <strong class="bar-title">ShitShooter · main menu lobbies</strong>
  <div class="bar-group" data-group="type"><span>Type</span><button data-value="now">Now</button><button data-value="list">1 Lobby list</button><button data-value="quick">2 Quick play</button><button data-value="saved">3 Saved lobbies</button><button data-value="live">4 Live panel</button><button data-value="mix">5 Mix: list + live + quick play</button></div>
  <div class="bar-group" data-group="size"><span>Window</span><button data-value="1280x720">1280×720</button><button data-value="1920x1080">1920×1080</button></div>
  <span class="bar-hint">Lobby data is made up for the demo</span>
  <span class="bar-fit" id="fit"></span>
</header>
<main class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="scene"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i></div>
    <section class="screen screen-menu" id="screen-menu">
      <div class="panel" id="menu-panel"></div>
      <div id="side-root"></div>
      <div class="mm-version">version 0.1.0</div>
      <div id="modal-root"></div>
    </section>
  </div>
</main>
<script src="lobbies.js"></script>
<script src="lobbies-shell.js"></script>
</body>
</html>
